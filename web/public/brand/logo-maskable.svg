  <g transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <rect x="14" y="16" width="6" height="32" rx="3" fill="#FFFFFF"></rect>
    <rect x="26" y="34" width="6" height="14" rx="3" fill="#FFFFFF"></rect>
    <rect x="36" y="26" width="6" height="22" rx="3" fill="#FFFFFF"></rect>
    <rect x="46" y="16" width="6" height="32" rx="3" fill="#FF7A3D"></rect>
  </g>
</svg>
